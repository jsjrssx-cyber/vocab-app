<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4A90D9">
  <title>畅畅背单词</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

  <!-- 首页 -->
  <div id="page-home" class="page active">
    <div class="page-header">
      <h1>畅畅背单词</h1>
    </div>
    <div class="home-content">
      <div class="book-switch">
        <button class="book-btn active" id="btn-book-textbook">人教版课本</button>
        <button class="book-btn" id="btn-book-zhongkao">中考考纲</button>
      </div>
      <div class="stat-cards">
        <div class="stat-card" id="card-new">
          <div class="stat-number" id="today-new">0</div>
          <div class="stat-label">今日新词</div>
        </div>
        <div class="stat-card" id="card-review" style="cursor:pointer;">
          <div class="stat-number" id="today-review">0</div>
          <div class="stat-label">待复习</div>
        </div>
        <div class="stat-card" id="card-streak">
          <div class="stat-number" id="streak-days">0</div>
          <div class="stat-label">连续天数</div>
        </div>
      </div>
      <button class="btn-primary btn-large" id="btn-start-learn">开始学习</button>
      <div class="home-progress">
        <div class="progress-info">
          <span>总进度</span>
          <span id="total-progress-text">0 / 0</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="total-progress-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 学习模式 -->
  <div id="page-learn" class="page">
    <div class="page-header">
      <button class="btn-back" id="btn-learn-back">←</button>
      <h1>学习新词</h1>
      <span class="word-counter" id="learn-counter">1 / 10</span>
    </div>
    <div class="learn-content">
      <!-- 音标始终显示 -->
      <div class="phonetic" id="word-phonetic-top" style="font-size:32px;color:#4A90D9;margin-bottom:16px;font-weight:600;"></div>
      <!-- 音节拼读阶段 -->
      <div class="word-display" id="word-display">
        <div class="word-full" id="word-full" style="display:none;"></div>
      </div>
      <!-- 释义区域 -->
      <div class="meaning-area" id="meaning-area" style="display:none;">
        <div class="phonetic" id="word-phonetic"></div>
        <div class="meaning" id="word-meaning"></div>
        <div class="example" id="word-example"></div>
      </div>
      <!-- 点击提示 -->
      <div class="tap-hint" id="tap-hint" style="display:none;">
        轻触查看释义 ↓
      </div>
    </div>
    <div class="learn-footer">
      <button class="btn-warning btn-large" id="btn-mark-hard" style="display:none;">Hard</button>
      <button class="btn-primary btn-large" id="btn-next-word" style="display:none;">Next →</button>
    </div>
  </div>

  <!-- 复习模式 -->
  <div id="page-review" class="page">
    <div class="page-header">
      <button class="btn-back" id="btn-review-back">←</button>
      <h1>复习</h1>
      <span class="word-counter" id="review-counter">1 / 10</span>
    </div>
    <div class="review-content">
      <div class="review-word" id="review-word"></div>
      <div class="review-phonetic" id="review-phonetic"></div>
      <div class="review-options" id="review-options"></div>
      <div class="review-result" id="review-result" style="display:none;"></div>
    </div>
    <div class="review-footer">
      <button class="btn-primary btn-large" id="btn-review-next" style="display:none;">下一题 →</button>
    </div>
  </div>

  <!-- 未掌握单词列表 -->
  <div id="page-hard-words" class="page">
    <div class="page-header">
      <button class="btn-back" id="btn-hard-words-back">←</button>
      <h1>未掌握</h1>
    </div>
    <div class="unit-words-content">
      <div id="hard-words-list"></div>
    </div>
  </div>

  <!-- 未掌握学习模式 -->
  <div id="page-hard-learn" class="page">
    <div class="page-header">
      <button class="btn-back" id="btn-hard-learn-back">←</button>
      <h1>未掌握复习</h1>
      <span class="word-counter" id="hard-learn-counter">1 / 1</span>
    </div>
    <div class="learn-content">
      <div class="phonetic" id="hard-phonetic-top" style="font-size:32px;color:#4A90D9;margin-bottom:16px;font-weight:600;"></div>
      <div class="word-display">
        <div class="word-full" id="hard-word-full" style="display:none;"></div>
      </div>
      <div class="meaning-area" id="hard-meaning-area" style="display:none;">
        <div class="phonetic" id="hard-phonetic"></div>
        <div class="meaning" id="hard-meaning"></div>
        <div class="example" id="hard-example"></div>
      </div>
      <div class="tap-hint" id="hard-tap-hint" style="display:none;">
        轻触查看释义 ↓
      </div>
    </div>
    <div class="learn-footer">
      <button class="btn-warning btn-large" id="btn-hard-got-it" style="display:none;">Got It</button>
      <button class="btn-primary btn-large" id="btn-hard-next" style="display:none;">Next →</button>
    </div>
  </div>

  <!-- 词库浏览 -->
  <div id="page-wordlist" class="page">
    <div class="page-header">
      <h1>词库</h1>
    </div>
    <div class="wordlist-content">
      <div id="unit-list"></div>
    </div>
  </div>

  <!-- 单元单词列表 -->
  <div id="page-unit-words" class="page">
    <div class="page-header">
      <button class="btn-back" id="btn-unit-back">←</button>
      <h1 id="unit-title">单元</h1>
    </div>
    <div class="unit-words-content">
      <div id="unit-words-list"></div>
    </div>
  </div>

  <!-- 统计 -->
  <div id="page-stats" class="page">
    <div class="page-header">
      <h1>学习统计</h1>
    </div>
    <div class="stats-content">
      <div class="stats-overview">
        <div class="stats-item">
          <div class="stats-value" id="stats-total">0</div>
          <div class="stats-label">已学单词</div>
        </div>
        <div class="stats-item">
          <div class="stats-value" id="stats-mastered">0</div>
          <div class="stats-label">已掌握</div>
        </div>
        <div class="stats-item">
          <div class="stats-value" id="stats-accuracy">0%</div>
          <div class="stats-label">正确率</div>
        </div>
      </div>
      <div class="stats-detail">
        <div class="stats-row">
          <span>今日学习</span>
          <span id="stats-today-learned">0 词</span>
        </div>
        <div class="stats-row">
          <span>今日复习</span>
          <span id="stats-today-reviewed">0 词</span>
        </div>
        <div class="stats-row">
          <span>连续打卡</span>
          <span id="stats-streak">0 天</span>
        </div>
        <div class="stats-row">
          <span>累计学习天数</span>
          <span id="stats-total-days">0 天</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="page-settings" class="page">
    <div class="page-header">
      <h1>设置</h1>
    </div>
    <div class="settings-content">
      <div class="settings-item">
        <span>每日新词数量</span>
        <input type="number" id="setting-daily-count" value="50" min="1" max="100" style="font-size:15px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;width:80px;text-align:center;">
      </div>
      <div class="settings-item">
        <button class="btn-danger" id="btn-reset">重置学习数据</button>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </button>
    <button class="nav-item" data-page="wordlist">
      <span class="nav-icon">📖</span>
      <span class="nav-label">词库</span>
    </button>
    <button class="nav-item" data-page="stats">
      <span class="nav-icon">📊</span>
      <span class="nav-label">统计</span>
    </button>
    <button class="nav-item" data-page="settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">设置</span>
    </button>
  </nav>

  <script src="js/words7a.js"></script>
  <script src="js/words7b.js"></script>
  <script src="js/words8a.js"></script>
  <script src="js/words8b.js"></script>
  <script src="js/words9.js"></script>
  <script src="js/words-zk-af.js"></script>
  <script src="js/words-zk-go.js"></script>
  <script src="js/words-zk-pz.js"></script>
  <script src="js/words-zhongkao.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ebbinghaus.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
